[project]
name = "endomind"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
