services:
  db:
    image: pgvector/pgvector:pg16
    container_name: endomind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: endomind
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: endomind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: