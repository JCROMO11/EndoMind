services:
  db:
    image: pgvector/pgvector:pg16
    container_name: endomind_db
    restart: unless-stopped
    environment:
      PSQL_USER: endominduser
      PSQL_PW: devendomind
      PSQL_DB: endomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: